<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuesday Dinner - Find Your Table</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;background:linear-gradient(135deg,#fbf7f0,#f3e7d7);color:#3b3028;padding:20px}.card{width:min(92vw,560px);background:#fffdf9;border:1px solid #dfcfbd;border-radius:24px;padding:38px 28px;box-shadow:0 12px 40px rgba(60,40,20,.12);text-align:center}h1{font-size:34px;margin:0 0 8px}h2{font-size:18px;font-weight:normal;letter-spacing:2px;margin:0 0 28px;color:#8a6f58}label{display:block;text-align:left;font-family:Arial,sans-serif;font-size:14px;margin-bottom:8px}input{width:100%;padding:15px;border:1px solid #cdbda9;border-radius:12px;font-size:17px}button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;background:#6f5945;color:white;font-size:17px;cursor:pointer}#result{margin-top:24px;min-height:90px;font-family:Arial,sans-serif}.table{font-family:Georgia,serif;font-size:46px;font-weight:bold;margin-top:8px;color:#6f5945}.note{font-size:13px;color:#806f61;margin-top:20px}</style></head><body><main class="card"><div style="font-size:34px">✦</div><h1>Find Your Table</h1><h2>TUESDAY DINNER</h2><label for="name">Enter your full name</label><input id="name" autocomplete="name" placeholder="First and Last Name" onkeydown="if(event.key==='Enter') findTable()"><button onclick="findTable()">FIND MY TABLE</button><div id="result"></div><div class="note">If your name is not found, please check the spelling or ask the welcome desk.</div></main><script>const guests = {"A. Aguilar": 5,"A. Alvarado": 1,"A. Arias": 5,"A. Avila": 3,"A. Barahona": 3,"A. Cabrera": 4,"A. Caceres": 1,"A. Canales": 5,"A. Cardona": 2,"A. Castillo": 5,"A. Diaz": 2,"A. Duarte": 5,"A. Escobar": 2,"A. Espinoza": 4,"A. Figueroa": 2,"A. Flores": 4,"A. Fuentes": 3,"A. Garcia": 5,"A. Gonzalez": 4,"A. Hernandez": 3,"A. Herrera": 5,"A. Jimenez": 2,"A. Lopez": 5,"A. Martinez": 3,"A. Medina": 4,"A. Mendoza": 3,"A. Morales": 2,"A. Navarro": 5,"A. Ortiz": 4,"A. Pacheco": 2,"A. Palacios": 5,"A. Perez": 3,"A. Portillo": 4,"A. Ramirez": 3,"A. Reyes": 2,"A. Rivera": 5,"A. Rodriguez": 4,"A. Romero": 3,"A. Salazar": 2,"A. Sanchez": 5,"A. Santos": 4,"A. Silva": 3,"A. Torres": 2,"A. Vargas": 5,"A. Vasquez": 4,"A. Velasquez": 3,"A. Zamora": 2,"B. Brown": 1,"C. Chen": 2,"D. Davis": 3,"E. Evans": 4};function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function findTable(){const q=norm(document.getElementById('name').value);const key=Object.keys(guests).find(n=>norm(n)===q);const result=document.getElementById('result');if(!q){result.innerHTML='<div>Please enter your name.</div>';return}if(key){result.innerHTML='<div>Welcome, <strong>'+key+'</strong>!</div><div class="table">TABLE '+guests[key]+'</div>'}else{result.innerHTML='<div>We could not find that name.</div><div>Please try your full name.</div>'}}</script></body></html>
