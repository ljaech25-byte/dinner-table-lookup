<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tuesday Dinner - Find Your Table</title>
<style>
body{font-family:Georgia,serif;background:#faf7f0;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;color:#3b3028}
.card{max-width:560px;width:100%;background:#fffdf9;padding:38px 28px;border:1px solid #dfcfbd;border-radius:24px;text-align:center;box-shadow:0 12px 40px #0001}
h1{font-size:34px;margin:0 0 8px}h2{font-size:18px;letter-spacing:2px;color:#8a6f58;margin:0 0 28px}
input,button{width:100%;padding:15px;border-radius:12px;font-size:17px;box-sizing:border-box}
input{border:1px solid #cdbda9}button{margin-top:14px;border:0;background:#6f5945;color:white}
.table{font-size:40px;font-weight:bold;color:#6f5945;margin-top:8px}.label{font-size:14px;letter-spacing:2px;color:#806f61;margin-top:16px}
#result{margin-top:24px;min-height:100px;font-family:Arial}.note{font-size:13px;color:#806f61;margin-top:20px}
</style></head>
<body><div class="card"><div style="font-size:34px">✦</div>
<h1>Find Your Table</h1><h2>TUESDAY DINNER</h2>
<input id="n" placeholder="First and Last Name" onkeydown="if(event.key==='Enter')f()">
<button onclick="f()">FIND MY TABLE</button><div id="result"></div>
<div class="note">If your name is not found, please check the spelling.</div></div>
<script>
const g={"Pierre Edouard Eouzan": "Miami Heat", "Coralie Thuillier": "Miami Marlins", "Bertrand De Riberolles": "Florida Panthers", "Fernando Ramirez": "Miami Grand Prix", "Alexandre Vigne": "Miami Marlins", "Annabelle Monier": "Florida Panthers", "Guillaume Collignon": "Miami Grand Prix", "Yohann Carriere": "Miami Dolphins", "Giovani Grassi": "Miami Marlins", "Paulo Biazotti": "Miami Heat", "Lionel Odeyer": "Miami Dolphins", "Andrea Sanchez": "Miami Marlins", "Carmen Marquez": "Miami Dolphins", "Wilson Soto (CCO)": "Miami Heat", "Julien Garcia": "Florida Panthers", "Javier Moreira": "Miami Heat", "Ophelie Pinon": "Miami Grand Prix", "Maria Cifuentes": "Miami Heat", "Guillermo Abella": "Miami Marlins", "Alejandra Chang": "Florida Panthers", "Julio Deras": "Miami Grand Prix", "Christian Castillo": "Miami Dolphins", "Enrique Elliot": "Miami Dolphins", "Juan Secco (CCO)": "Miami Grand Prix", "Vitor Gomes": "Miami Grand Prix", "Fabian Hernandez": "Florida Panthers", "Michael Latimer": "Miami Heat", "Stephane Moteyen": "Miami Marlins", "Lionel Sohier": "Miami Grand Prix", "Clayton Charles": "Miami Heat", "Robby Jiawan (CCO)": "Miami Dolphins", "Ganesh Sugrim": "Miami Grand Prix", "Jean-Yves Duval": "Miami Heat", "Andres Cavelier": "Miami Marlins", "Jorge Serres": "Miami Dolphins", "Sylvain Cheminant": "Miami Dolphins", "Nada Boudaz": "Florida Panthers", "Cristina Quintanilla": "Miami Dolphins", "Andrea Rodriguez": "Miami Heat", "Juan Camilo de la Pava": "Miami Grand Prix", "Timothee Frenois": "Florida Panthers", "Eda Bora": "Miami Grand Prix", "Monica Escobedo": "Miami Marlins", "Diego Ortiz": "Florida Panthers", "Laure Saulnier": "Florida Panthers", "Eduardo Galo": "Miami Heat", "Felipe Santos": "Florida Panthers", "Henrique Martins": "Miami Marlins", "Marcello Grimberg": "Miami Dolphins", "Juan Carlos Puerto": "Miami Marlins"};
const names=g;
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function f(){let q=norm(document.getElementById('n').value),k=Object.keys(g).find(x=>norm(x)===q);
document.getElementById('result').innerHTML=!q?'Please enter your name.':
k?'<div>Welcome, <b>'+k+'</b>!</div><div class="label">YOUR TABLE</div><div class="table">'+g[k]+'</div>':
'<div>Name not found.</div><div>Please check the spelling.</div>'}
</script></body></html>
