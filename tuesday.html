<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuesday Dinner - Find Your Table</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;background:linear-gradient(135deg,#fbf7f0,#f3e7d7);color:#3b3028;padding:20px}.card{width:min(92vw,560px);background:#fffdf9;border:1px solid #dfcfbd;border-radius:24px;padding:38px 28px;box-shadow:0 12px 40px rgba(60,40,20,.12);text-align:center}h1{font-size:34px;margin:0 0 8px}h2{font-size:18px;font-weight:normal;letter-spacing:2px;margin:0 0 28px;color:#8a6f58}label{display:block;text-align:left;font-family:Arial,sans-serif;font-size:14px;margin-bottom:8px}input{width:100%;padding:15px;border:1px solid #cdbda9;border-radius:12px;font-size:17px}button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;background:#6f5945;color:white;font-size:17px;cursor:pointer}#result{margin-top:24px;min-height:90px;font-family:Arial,sans-serif}.table{font-family:Georgia,serif;font-size:46px;font-weight:bold;margin-top:8px;color:#6f5945}.note{font-size:13px;color:#806f61;margin-top:20px}</style></head><body><main class="card"><div style="font-size:34px">✦</div><h1>Find Your Table</h1><h2>TUESDAY DINNER</h2><label for="name">Enter your full name</label><input id="name" autocomplete="name" placeholder="First and Last Name" onkeydown="if(event.key==='Enter') findTable()"><button onclick="findTable()">FIND MY TABLE</button><div id="result"></div><div class="note">If your name is not found, please check the spelling or ask the welcome desk.</div></main><script>const guests={"Pierre Edouard Eouzan":1,"Coralie Thuillier":2,"Bertrand De Riberolles":4,"Fernando Ramirez":5,"Alexandre Vigne":2,"Annabelle Monier":4,"Guillaume Collignon":5,"Andrea Rodriguez":1,"Clayton Charles":2,"Eduardo Galo":3,"Javier Moreira":4,"Jean-Yves Duval":5,"Alejandra Chang":1,"Fabian Hernandez":2,"Felipe Santos":3,"Ganesh Sugrim":4,"Jasmine Patel":5,"John Smith":1,"Maria Lopez":2,"Carlos Perez":3,"Ana Garcia":4,"Michael Brown":5,"Sarah Johnson":1,"Daniel Lee":2,"Laura Martinez":3,"Robert Davis":4,"Emily Wilson":5,"David Miller":1,"Sofia Garcia":2,"James Anderson":3,"Olivia Thomas":4,"William Taylor":5,"Emma Moore":1,"Benjamin Jackson":2,"Charlotte Martin":3,"Henry Thompson":4,"Amelia White":5,"Lucas Harris":1,"Mia Clark":2,"Alexander Lewis":3,"Harper Walker":4,"Daniel Hall":5,"Evelyn Allen":1,"Matthew Young":2,"Abigail King":3,"Samuel Wright":4,"Elizabeth Scott":5,"Joseph Green":1,"Ella Baker":2,"Christopher Adams":3,"Grace Nelson":4};function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function findTable(){const q=norm(document.getElementById('name').value);const key=Object.keys(guests).find(n=>norm(n)===q);const result=document.getElementById('result');if(!q){result.innerHTML='<div>Please enter your name.</div>';return}if(key){result.innerHTML='<div>Welcome, <strong>'+key+'</strong>!</div><div class="table">TABLE '+guests[key]+'</div>'}else{result.innerHTML='<div>We could not find that name.</div><div>Please try your full name.</div>'}}</script></body></html>
