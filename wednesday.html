Cavelier":2,"Bismarck Gonzalez":4,"Sylvain Cheminant":3,"Lauren Guidry":5,"Felipe Tauro":3,"Nada Boudaz":4,"Maritza Rodriguez":2,"Luisa Valencia":4,"Juan Camilo de la Pava":5,"Timothee Frenois":5,"Sandra Foeng":3,"Monica Escobedo":3,"Juan Carlos Puerto":1,"Raul Angeles":3,"Eduardo Galo":4,"Felipe Santos":1,"Marcello Grimberg":5};function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function f(){let q=norm(n.value),k=Object.keys(g).find(x=>norm(x)===q);result.innerHTML=!q?'Please enter your name.':k?'<div>Welcome, <b>'+k+'</b>!</div><div class="table">TABLE '+g[k]+'</div>':'<div>Name not found.</div><div>Please check the spelling.</div>'}</script>
