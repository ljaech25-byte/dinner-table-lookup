<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wednesday Dinner - Find Your Table</title>
<style>
body{font-family:Georgia,serif;background:#faf7f0;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;color:#3b3028}
.card{max-width:560px;width:100%;background:#fffdf9;padding:38px 28px;border:1px solid #dfcfbd;border-radius:24px;text-align:center;box-shadow:0 12px 40px #0001}
h1{font-size:34px;margin:0 0 8px}h2{font-size:18px;letter-spacing:2px;color:#8a6f58;margin:0 0 28px}
input,button{width:100%;padding:15px;border-radius:12px;font-size:17px;box-sizing:border-box}
input{border:1px solid #cdbda9}button{margin-top:14px;border:0;background:#6f5945;color:white}
.table{font-size:40px;font-weight:bold;color:#6f5945;margin-top:8px}.label{font-size:14px;letter-spacing:2px;color:#806f61;margin-top:16px}
#result{margin-top:24px;min-height:100px;font-family:Arial}.note{font-size:13px;color:#806f61;margin-top:20px}
</style></head>
<body><div class="card"><div style="font-size:34px">✦</div>
<h1>Find Your Table</h1><h2>WEDNESDAY DINNER</h2>
<input id="n" placeholder="First and Last Name" onkeydown="if(event.key==='Enter')f()">
<button onclick="f()">FIND MY TABLE</button><div id="result"></div>
<div class="note">If your name is not found, please check the spelling.</div></div>
<script>
const g={"Pierre Edouard Eouzan": "Miami Marlins", "Coralie Thuillier": "Miami Grand Prix", "Bertrand De Riberolles": "Miami Dolphins", "Fernando Ramirez": "Florida Panthers", "Alexandre Vigne": "Florida Panthers", "Annabelle Monier": "Miami Heat", "Guillaume Collignon": "Florida Panthers", "Yohann Carriere": "Miami Heat", "Giovani Grassi": "Miami Heat", "Paulo Biazotti": "Miami Grand Prix", "Lionel Odeyer": "Miami Heat", "Andrea Sanchez": "Miami Grand Prix", "Carmen Marquez": "Florida Panthers", "Wilson Soto (CCO)": "Miami Marlins", "Julien Garcia": "Miami Marlins", "Javier Moreira": "Miami Grand Prix", "Ophelie Pinon": "Florida Panthers", "Maria Cifuentes": "Miami Marlins", "Guillermo Abella": "Miami Dolphins", "Alejandra Chang": "Miami Heat", "Julio Deras": "Miami Dolphins", "Christian Castillo": "Miami Marlins", "Enrique Elliot": "Miami Marlins", "Juan Secco (CCO)": "Miami Marlins", "Vitor Gomes": "Miami Marlins", "Fabian Hernandez": "Miami Heat", "Michael Latimer": "Miami Grand Prix", "Stephane Moteyen": "Florida Panthers", "Lionel Sohier": "Miami Dolphins", "Clayton Charles": "Miami Dolphins", "Robby Jiawan (CCO)": "Miami Grand Prix", "Ganesh Sugrim": "Miami Heat", "Jean-Yves Duval": "Miami Heat", "Andres Cavelier": "Miami Marlins", "Bismarck Gonzalez": "Florida Panthers", "Sylvain Cheminant": "Miami Dolphins", "Lauren Guidry": "Miami Grand Prix", "Felipe Tauro": "Miami Dolphins", "Nada Boudaz": "Florida Panthers", "Maritza Rodriguez": "Miami Marlins", "Luisa Valencia": "Florida Panthers", "Juan Camilo de la Pava": "Miami Grand Prix", "Timothee Frenois": "Miami Grand Prix", "Sandra Foeng": "Miami Dolphins", "Monica Escobedo": "Miami Dolphins", "Juan Carlos Puerto": "Miami Heat", "Raul Angeles": "Miami Dolphins", "Eduardo Galo": "Florida Panthers", "Felipe Santos": "Miami Heat", "Marcello Grimberg": "Miami Grand Prix"};
const names=g;
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function f(){let q=norm(document.getElementById('n').value),k=Object.keys(g).find(x=>norm(x)===q);
document.getElementById('result').innerHTML=!q?'Please enter your name.':
k?'<div>Welcome, <b>'+k+'</b>!</div><div class="label">YOUR TABLE</div><div class="table">'+g[k]+'</div>':
'<div>Name not found.</div><div>Please check the spelling.</div>'}
</script></body></html>
